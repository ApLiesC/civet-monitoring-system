<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civet Behavior Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Civet behavior summary</h1>
  <p class="sub">Behaviors detected by the model, with start time, stop time and duration.</p>
  <div class="bar">
    <label for="day">Day</label>
    <select id="day"></select>
    <span id="status" class="sub"></span>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="grid">
    <section class="card"><h2>Active vs inactive time</h2><div class="chart"><canvas id="pie"></canvas></div></section>
    <section class="card"><h2>Frequency per day</h2><div class="chart"><canvas id="bar"></canvas></div></section>
  </div>
  <div class="tables" id="tables"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
